<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Cards</title>
    <link rel="stylesheet" href="./styles.css">
  </head>

  <body>
    <main id="playing-cards">
      <!-- Card 1: Spades -->
      <div class="card A">
        <div class="left">A &hairsp;♠</div>
        <div class="middle">
          <span id="bigger">♠</span>
        </div>
        <div class="right">A &hairsp;♠</div>
      </div>

      <!-- Card 2: Hearts -->
      <div class="card K">
        <div class="left">K ♥</div>
        <div class="middle">
          <span>♥</span>
          <span class="mid-letter">K</span>
          <span class="down">♥</span>
        </div>
        <div class="right">K ♥</div>
      </div>

      <!-- Card 3: Diamonds -->
      <div class="card Q">
        <div class="left">Q &#8198;♦</div>
        <div class="middle">
          <span>♦</span>
          <span id="Qlet" class="mid-letter">Q</span>
          <span class="down">♦</span>
        </div>
        <div class="right">Q &#8198;♦</div>
      </div>

      <!-- The Animated Joker Card -->
      <div class="card joker">
        <span class="corner top">J <br> o <br> k <br> e <br> r <br> 🃏</span>

          <div class="sprite"></div>

        <span class="corner bottom">J <br> o <br> k <br> e <br> r <br> 🃏</span>
      </div>
    </main>
  </body>

</html>
