<!DOCTYPE html>
<html lang="en">	
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Contact Form</title>
		<link rel="stylesheet" href="./styles.css">
	</head>

	<body>
		<div class="form-container">
			<form>
				<h2>Customer Complaint Form</h2>

				<label for="name">
					Full Name:
				</label>
				<input
					id="name"
					type="text"
					name="name"
					placeholder="John Doe..."
					required
				/>

				<label for="email">
					Email Address
				</label>
				<input
					id="email"
					name="email"
					type="email"
					placeholder="johndoe@gmail.com..."
					required
				/>

				<label for="complaint-type">
					Reason for Complaint:
				</label>
				<select id="complaint-type">
					<option value="" disabled selected>
						Select a Reason
					</option>
					<option value="defects">
						Product Defects
					</option>
					<option value="service-quality">
						Poor Service Quality
					</option>
					<option value="delays">
						Shipping Delays
					</option>
					<option value="billing">
						Billing Issues
					</option>
					<option value="customer-experience">
						Poor Customer Experience
					</option>
				</select>

				<label for="additional-info">
					Please Provide Additional Details:
				</label>
				<textarea
					id="additional-info"
					name="additional-info"
					rows=5
					cols=10
					placeholder="My experience with this service was..."
					required
				></textarea>

				<label for="picture-evidence">
					Attatch a Photo of The Damaged Product:
				</label>
				<input id="picture-evidence" type="file">

				<button class="submit-btn" type="submit">Submit</button>
			</form>
		</div>
	</body>
</html>
