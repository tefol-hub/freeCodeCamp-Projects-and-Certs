<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta 
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Selection Feature Page</title>
    <link rel="stylesheet" href="./styles.css">
    <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" 
        crossorigin="anonymous" 
        referrerpolicy="no-referrer" 
    />
</head>

<body>
    <h1>Feature Selection</h1>
    <div class="feature-card-container">
        <label class="feature-card">
            <input type="checkbox" />
            <i class="fa-solid fa-charging-station fa-2x"></i>
            <span class="feature-txt">Electric Charging</span>
        </label>
        <label class="feature-card">
            <input type="checkbox" />
            <i class="fa-solid fa-triangle-exclamation fa-2x"></i>
            <span class="feature-txt">Safety Alerts</span>
        </label>
        <label class="feature-card">
            <input type="checkbox" />
            <i class="fa-solid fa-wifi fa-2x"></i>
            <span class="feature-txt">Connectivity</span>
        </label>
        <label class="feature-card">
            <input type="checkbox" />
            <i class="fa-solid fa-key fa-2x"></i>
            <span class="feature-txt">Keys/Remote Start</span>
        </label>
        <label class="feature-card">
            <input type="checkbox" />
            <i class="fa-solid fa-gauge-high fa-2x"></i>
            <span class="feature-txt">Maintenance/TPMS</span>
        </label>
        <label class="feature-card">
            <input type="checkbox" />
            <i class="fa-solid fa-music fa-2x"></i>
            <span class="feature-txt">Infotainment</span>
        </label>
    </div>
</body>

</html>
