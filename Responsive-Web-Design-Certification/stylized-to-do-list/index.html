<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="./styles.css"
</head>

<body>
    <form>
        <h1>Shopping Todo List</h1>
        <ul class="todo-list">
            <li>
                <input type="checkbox" id="keyboard" name="pc-parts" value="keyboard" />
                <label for="keyboard">Purchase keyboard for PC</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://www.amazon.com/Keyboards-Mice-Computer-Add-Ons-Computers/b?ie=UTF8&node=12879431" target="_blank">
                            QWERTY Keyboard from Amazon
                        </a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="RAM" name="pc-parts" value="RAM" />
                <label for="RAM">Purchase TeamGroup RAM</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://www.amazon.com/s?k=RAM&crid=BM0C2CB3UYTJ&sprefix=ra%2Caps%2C518&ref=nb_sb_noss_2" target="_blank">
                            16GB RAM from Amazon
                        </a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="SSD" name="pc-parts" value="SSD" />
                <label for="SSD">Purchase a Samsung 1TB SSD</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://www.amazon.com/s?k=SSD&crid=8TR1VZGSPYF1&sprefix=ssd%2Caps%2C439&ref=nb_sb_noss_1" target="_blank">
                            SSD's from Amazon
                        </a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="CPU" name="pc-parts" value="CPU" />
                <label for="CPU">Purchase a Ryzen 7 CPU</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://www.amazon.com/s?k=CPU&crid=3UY84OBL1MJS3&sprefix=cpu%2Caps%2C628&ref=nb_sb_noss_1" target="_blank">
                            CPU's from Amazon
                        </a>
                    </li>
                </ul>
            </li>
        </ul>
    </form>
</body>

</html>
