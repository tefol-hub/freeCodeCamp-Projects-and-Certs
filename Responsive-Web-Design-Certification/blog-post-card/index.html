<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog Post Card</title>
        <link rel="stylesheet" href="./styles.css">
    
  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tefol-hub.github.io/freeCodeCamp-Projects-and-Certs/Responsive-Web-Design-Certification/blog-post-card/">
  <meta property="og:title" content="Blog Post Card">
  <meta property="og:description" content="">
  <meta property="og:image" content="https://tefol-hub.github.io/freeCodeCamp-Projects-and-Certs/Responsive-Web-Design-Certification/blog-post-card/media/screenshot_thumb.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://tefol-hub.github.io/freeCodeCamp-Projects-and-Certs/Responsive-Web-Design-Certification/blog-post-card/">
  <meta name="twitter:title" content="Blog Post Card">
  <meta name="twitter:description" content="">
  <meta name="twitter:image" content="https://tefol-hub.github.io/freeCodeCamp-Projects-and-Certs/Responsive-Web-Design-Certification/blog-post-card/media/screenshot_thumb.png">
</head>
    <body>
        <div class="blog-post-card">
            <img 
                class="post-img" 
                src="https://media.istockphoto.com/id/2214651343/photo/emerging-financial-data-stock-market-prosperity-bull-market-blue-version.jpg?s=612x612&w=0&k=20&c=bvLSWyBeG8SLIS8qqOD4BPHfLMo_Lu5fc1ZWPYJdZmU=" 
                alt="Stock Market Charts" 
                class="post-img" 
            />
            <div class="post-content">
                <h2 class="post-title">
                    Get Access To a Reliable Forex Charting Tool
                </h2>
                <p class="post-excerpt"> 
                    Charting tools are old fashioned and lacking in their qaulity of market information. Ours is modern and relevant for the big 2026!
                </p>
                <a class="read-more">Read More</a>
            </div>
        </div>
    </body>
</html>
