<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>

    <section>
        <h2>Your Cart</h2>
        <img 
            src="https://i.etsystatic.com/40022135/r/il/f02cf2/5742430946/il_300x300.5742430946_qg8l.jpg"
            alt="Small bronze statue of Napoleon riding a reared horse"
        />
        <p>bronze statue of Napoleon on a horse</p>
        <p>$599.99</p>
    </section>

    <section>
        <h2>Payment Information</h2>
        <form>
            <div>
                <label for="card-name">
                    Name on Card <span aria-hidden="true">*</span>
                </label>
                <input 
                    type="text" 
                    id="card-name" 
                    name="card-name" 
                    autocomplete="cc-name"
                    required 
                />
            </div>

            <div>
                <label for="card-number">
                    Card Number <span aria-hidden="true">*</span>
                </label>
                <input 
                    type="text" 
                    id="card-number" 
                    name="card-number" 
                    aria-describedby="card-number-help" 
                    pattern="[0-9]{12,19}"
                    autocomplete="cc-number" 
                    maxlength="16"
                    required 
                />
                <p id="card-number-help">Please enter your 16-digit card number without adding any spaces or dashes.</p>
            </div>

            <div>
                <label for="expiry-date">
                    Expiry Date <span aria-hidden="true">*</span>
                </label>
                <input 
                    type="text" 
                    id="expiry-date" 
                    name="expiry-date" 
                    placeholder="MM/YY" 
                    pattern="(?:0[1-9]|1[0-2])\/[0-9]{2}"
                    autocomplete="cc-exp"
                    required 
                />
            </div>

            <div>
                <label for="cvc">
                    CVC <span aria-hidden="true">*</span>
                </label>
                <input 
                    type="tel" 
                    id="cvc" 
                    name="cvc" 
                    pattern="[0-9]{3,4}"
                    autocomplete="cc-csc" 
                    maxlength="4"
                    required 
                />
            </div>

            <input type="submit" value="Submit Details">
        </form>
    </section>
</body>

</html>
