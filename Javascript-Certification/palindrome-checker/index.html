  <body>
    <header>
      <div id="header">
        <h2>Tefo's Palindrome</h2>
      </div>
    </header>
    <main>
      <h1>Is Your Text A Palindrome?</h1>

      <div id="main-div">
        <label for="text-input">Type in a word or sentence to check...</label>
        <div id="checker">
          <input id="text-input" />
          <button id="check-btn">Check</button>
        </div>
        <span id="result">
          <strong>"text"</strong> a palindrome
        </span>
      </div>

      <div id="palindrome-def">
        <p class="par-text">💡 *A <i>palindrome</i> is a word or sentence that is spelled the same way both forward and backward, ignoring punctuation, case, and spacing.</p>
      </div>

    </main>
