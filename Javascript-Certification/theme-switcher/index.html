<head>

  <!-- Open Graph / Twitter -->

  <meta property="og:url" content="https://tefol-hub.github.io/freeCodeCamp-Projects-and-Certs/Javascript-Certification/theme-switcher/">

</head>
<body>
  <button
    id="theme-switcher-button"
    aria-haspopup="true"
    aria-expanded="false"
    aria-controls="theme-dropdown"
  >Switch Theme</button>
  <ul 
    id="theme-dropdown"
    role="menu"
    aria-labelledby="theme-switcher-button"
    hidden
  >
    <li id="theme-light" role="menuitem">light</li>
    <li id="theme-dark" role="menuitem">dark</li>
    <li id="theme-autumn" role="menuitem">autumn</li>
  </ul>
  <p aria-live="polite"></p>
  <script src="./script.js"></script>
</body>
</html>
